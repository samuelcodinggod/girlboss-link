<!DOCTYPE html>
<html lang="en">
<head>

  <title>TikTok test: G, H, I, J</title>
  <link rel="stylesheet" href="/t/style.css?v=3" />
</head>
<body>
  <div class="card">
    <h1>TikTok tests G to J</h1>
    <p>Open this page from TikTok. Tap one test, watch what happens, then come back here and tap the next one.</p>
    <!-- TEST G: a tap on Safari's x-safari-https link to a page that says if it left TikTok. -->
    <a class="btn" href="x-safari-https://getgirlbossapp.com/t/landed/?via=G">Test G</a>
    <!-- TEST H: a tap on x-safari-https straight to the App Store page. -->
    <a class="btn" href="x-safari-https://apps.apple.com/us/app/girlboss-stay-focused/id6757707992">Test H</a>
    <!-- TEST I: the same jump as G, but with NO tap (the page tries it by itself). -->
    <a class="btn" href="/t/tt/i/">Test I</a>
    <!-- TEST J: a normal link that asks for a new window. -->
    <a class="btn" href="https://getgirlbossapp.com/t/landed/?via=J" target="_blank" rel="noopener">Test J</a>
    <p>When you finish, tell Claude what each test did. For example: “G opened Safari, H did nothing”.</p>
  </div>
</body>
