<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="origin" />
  <title>Get GirlBoss</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF9F8; color: #3D3D3D;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    /* Instagram/FB: pin the card near the top so it sits high on screen and
       leaves the top-right clear for the ••• arrow. */
    body.meta {
      align-items: flex-start;
      padding-top: calc(58px + env(safe-area-inset-top));
    }
    .card { width: 100%; max-width: 380px; }
    /* Real app icon, inlined as a data URI so it paints with the HTML —
       Meta's in-app browser is slow to fetch subresources. 240px source = 80pt @3x. */
    .mark {
      display: block; width: 80px; height: 80px; margin: 0 auto 18px;
      border-radius: 22%;
      box-shadow: 0 8px 24px rgba(61, 61, 61, 0.13);
    }
    h1 { font-size: 33px; font-weight: 700; margin: 0 0 26px; letter-spacing: -0.6px; }

    /* Direct button (Safari / TikTok / desktop) */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #EC1C6E; color: #fff; text-decoration: none;
      font-size: 18px; font-weight: 600; padding: 17px 22px; border-radius: 15px;
      box-shadow: 0 8px 22px rgba(236, 28, 110, 0.32);
      transition: transform .08s ease, opacity .08s ease;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn svg { width: 20px; height: 20px; fill: #fff; }
    .hint { font-size: 13px; color: #9E9E9E; margin-top: 20px; line-height: 1.55; }

    /* Meta (Instagram/FB) instruction card — the only path that works there */
    #steps { display: none; }
    .steps-title { font-size: 21px; font-weight: 700; margin: 0 0 18px; letter-spacing: -0.3px; }
    ol.steps { text-align: left; margin: 0 auto; padding: 0; list-style: none; }
    ol.steps li {
      display: flex; align-items: flex-start; gap: 12px;
      background: #fff; border: 1px solid rgba(236,28,110,.25); border-radius: 14px;
      padding: 16px 16px; margin-bottom: 11px; font-size: 18px; line-height: 1.38;
    }
    ol.steps li .n {
      flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
      background: #EC1C6E; color: #fff; font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    ol.steps li b { color: #3D3D3D; }
    .dots-chip { display:inline-block; background:#F0EEEC; border-radius:6px; padding:0 8px; font-weight:700; letter-spacing:1px; }

    /* Bouncing arrow pointing at the ••• menu (top-right).
       Meta's in-app browser toolbar is [X] ... [Meta AI] [•••] — the ••• is always
       the RIGHTMOST button. Measured off a 430pt iPhone: ••• centre sits 30pt in
       from the right edge, Meta AI's icon 74pt in. Anchor the arrowhead at 30px;
       do NOT centre it over the label (that ~100px-wide chip used to drop the tip
       at ~64px — i.e. straight onto the Meta AI button). */
    #arrow {
      display: none; position: fixed;
      top: calc(4px + env(safe-area-inset-top)); left: 0; right: 0; height: 0;
      z-index: 20; pointer-events: none; animation: bob 1s ease-in-out infinite;
    }
    #arrow .up {
      position: absolute; top: 0; right: 30px; transform: translateX(50%);
      font-size: 30px; line-height: 1; font-weight: 700; color: #EC1C6E;
    }
    #arrow .lbl {
      position: absolute; top: 36px; right: 12px;
      background:#3D3D3D; color:#fff;
      font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; white-space: nowrap;
    }
    @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
    @media (prefers-color-scheme: dark) {
      #arrow .lbl { background:#f2f2f2; color:#1c1c1c; }
    }
  </style>
</head>

      // to the App Store, leaving the user staring at instructions for a ••• menu
      // that doesn't exist there. Never pattern-match a whole query string again.
      //   ?preview → show the direct button but DON'T auto-redirect
      //   ?ig      → force the steps screen in any browser (arrow aim is only
      //              meaningful against Instagram's real toolbar)
      //   ?debug   → dump UA + resolved flags instead of rendering
      var hasParam = function (name) {
        try { return new URLSearchParams(location.search).has(name); }
        catch (e) { return new RegExp('[?&]' + name + '(?=$|[=&])').test(location.search); }
      };
      var preview    = hasParam('preview');
      var forceSteps = hasParam('ig') || hasParam('steps');

      if (hasParam('debug')) {
        var esc = function (t) {
          return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        };
        document.body.style.cssText = 'display:block;text-align:left;padding:0;background:#FAF9F8';
        document.body.innerHTML =
          '<pre style="font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;' +
          'word-break:break-all;padding:16px;margin:0;color:#3D3D3D">' +
          'URL\n'         + esc(location.href) +
          '\n\nUSER AGENT\n' + esc(ua) +
          '\n\nFLAGS\nisIOS      = ' + isIOS +
          '\nisMeta     = ' + isMeta +
          '\npreview    = ' + preview +
          '\nforceSteps = ' + forceSteps +
          '\n\nWOULD SHOW\n' +
          ((forceSteps || (isMeta && !preview))
            ? 'steps screen (Instagram path)'
            : 'direct App Store handoff') +
          '</pre>';
        return;
      }

      if (forceSteps || (isMeta && !preview)) {
        // Show the guided path — hide the dead button so nobody taps a no-op.
        document.body.classList.add('meta');   // top-align the card, clear room for the arrow
        document.getElementById('direct').style.display = 'none';
        document.getElementById('steps').style.display  = 'block';
        document.getElementById('arrow').style.display  = 'block';
      } else {
        // Safari / Chrome / TikTok / desktop: hand off directly, no extra tap.
        var target = isIOS ? SCHEME : HTTPS;
        document.getElementById('cta').setAttribute('href', target);
        if (!preview) setTimeout(function () { try { window.location.href = target; } catch (e) {} }, 60);
      }
    })();
  </script>
</body>
</html>
